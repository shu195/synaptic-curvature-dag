[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptic-curvature-dag"
version = "0.1.0"
description = "Self-rewiring multi-hop feedforward DAG networks with matrix-free second-order curvature pruning and multi-agent swarm kinetics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "shu195 & Antigravity Research Lab" }
]
keywords = [
    "deep-learning",
    "neural-network-pruning",
    "second-order-optimization",
    "directed-acyclic-graph",
    "hessian-vector-product",
    "particle-swarm-optimization"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
